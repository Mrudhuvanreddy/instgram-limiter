<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 18px;
      margin: 0;
      background: #fafafa;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 4px 0;
      background: linear-gradient(135deg, #833ab4, #fd1d1d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    .stat-box {
      background: white;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .progress-track {
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #833ab4, #fd1d1d);
      transition: width 0.3s;
    }
    label {
      font-size: 12px;
      color: #555;
      display: block;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #833ab4;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button.secondary {
      background: white;
      border: 1px solid #ddd;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Instagram Limiter</h2>
  <div class="sub">Resets daily at midnight</div>

  <div class="stat-box">
    <div class="stat-row"><span>Used today</span><span id="used-label">0 min</span></div>
    <div class="stat-row"><span>Daily limit</span><span id="limit-label">30 min</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <label for="limit-input">Set daily limit (minutes)</label>
  <input type="number" id="limit-input" min="1" max="600" />
  <button id="save-btn">Save Limit</button>
  <button class="secondary" id="reset-btn">Reset Today's Usage</button>

  <script src="popup.js"></script>
</body>
</html>
